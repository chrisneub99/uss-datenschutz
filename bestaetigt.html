<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>E-Mail bestätigt · Ultimate Sport Score</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #FB7185 0%, #F43F5E 100%);
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #3a1620;
    }
    .card {
      background: #FFF6F1;
      border-radius: 28px;
      max-width: 420px;
      width: 100%;
      padding: 40px 30px 34px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.22);
    }
    .check {
      width: 84px;
      height: 84px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: linear-gradient(160deg, #FB7185 0%, #F43F5E 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(244, 63, 94, 0.4);
    }
    .check svg { width: 44px; height: 44px; }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 12px; color: #2a0f16; }
    p { font-size: 16px; line-height: 1.5; color: #6b4650; }
    .divider { height: 1px; background: rgba(0,0,0,0.08); margin: 26px 0; }
    .en h1 { font-size: 21px; }
    .en p { font-size: 14.5px; }
    .brand { margin-top: 28px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: #FB7185; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>E-Mail bestätigt!</h1>
    <p>Alles erledigt. Du kannst dieses Fenster schließen und dich jetzt in der <strong>Ultimate Sport Score</strong>-App einloggen.</p>

    <div class="divider"></div>

    <div class="en">
      <h1>Email confirmed!</h1>
      <p>All done. You can close this window and log in to the <strong>Ultimate Sport Score</strong> app now.</p>
    </div>

    <div class="brand">Ultimate Sport Score</div>
  </div>
</body>
</html>
